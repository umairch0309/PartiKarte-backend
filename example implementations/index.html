<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Previews</title>
</head>
<body>
    <div id="eventPreviews"></div>

    <script>
        async function fetchEvents() {
            try {
                const response = await fetch('http://127.0.0.1:5600/events/search/all');
                const events = await response.json();
                return events;
            } catch (error) {
                console.error('Error fetching events:', error);
            }
        }

        async function displayEventPreviews() {
            const events = await fetchEvents();
            const eventPreviewsContainer = document.getElementById('eventPreviews');

            events.forEach(async (event) => {
                const eventPreview = document.createElement('div');
                eventPreview.innerHTML = `
                    <h2>${event.eventName}</h2>
                    <p>${event.eventDescription}</p>
                `;

                if (event.eventBannerId) {
                    const img = document.createElement('img');

                    const startTime = performance.now(); // start measuring time

                    img.onload = () => {
                        const endTime = performance.now(); // end measuring time
                        const loadTime = endTime - startTime;
                        console.log(`Image loaded in ${loadTime} milliseconds.`)
                    };

                    img.onerror = () => {
                        console.error(`Failed to load image with ID ${event.eventBannerId}.`);
                    };

                    img.src = `http://127.0.0.1:5600/events/eventBanner/${event.eventBannerId}`;
                    img.style.width = '200px';
                    img.style.height = '100px';
                    eventPreview.appendChild(img);
                }

                eventPreviewsContainer.appendChild(eventPreview);
            });
        }

        displayEventPreviews();
    </script>
</body>
</html>
